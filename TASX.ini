; TASX configuration. Every key is optional - missing keys use defaults.
; Booleans: 1/0 (true/false/on/off also accepted).

[TASX]
; Hard-trim memory of UNFOCUSED Roblox instances on a schedule.
; The focused instance is never trimmed (that would cause stutter).
TrimUnfocused=1
TrimIntervalSec=10

; Adaptive cadence: trim faster when RAM commit is high, slower when low.
AdaptiveTrim=1
; Skip clients whose working set is already below this (MB) - zero cost.
TrimSkipBelowMB=120

; Per-client Job Object caps (0 = off). JobMemoryCapMB caps each client's
; private commit; hitting it makes allocations fail - use with care.
JobCpuCapPercent=0
JobMemoryCapMB=0

; React to the kernel's low-memory notification: purge standby + trim all
; background clients the moment Windows runs out (no polling).
LowMemReactor=1

; Kill RobloxCrashHandler.exe (spawns with every crash dialog).
; With many clients this alone saves a lot of RAM.
KillCrashHandler=1

; 0.5 ms system timer resolution while Roblox runs (smoother frame pacing).
TimerResolution=1

; Switch the power scheme to Ultimate/High Performance while Roblox runs,
; restore the previous scheme when the last instance closes.
PowerPlan=1

; Purge the standby list right when a Roblox instance appears (needs admin).
PurgeStandbyOnLaunch=1

; FULL-SYSTEM MEMORY CLEANER (needs admin): periodically purges the standby
; list and empties all process working sets, so Windows itself stays snappy
; while a farm of clients hogs RAM.
SystemCleaner=1
SystemCleanIntervalSec=180

; One-time registry tweaks: GameDVR off, Game Mode on, MMCSS gaming profile,
; network throttling off, high-performance GPU preference for Roblox.
; HKLM entries apply only when TASX runs elevated (scheduled-task install).
ApplyTweaks=1

; System-wide CPU turbo boost toggle. Leave 0: disabling boost would also
; throttle the focused game. Enable only for cool/quiet farming setups.
DisableCpuBoost=0

; Dynamic P/E migration: when a client is focused, background clients are
; pinned to E-cores; when NOTHING is focused (pure farm), they get all cores
; (optionally CpuRate-capped via JobCpuCapPercent so the shell stays snappy).
; Set DynamicAffinity=0 to always keep the static E-core pinning.
DynamicAffinity=1

; Mute background clients via the WASAPI session API (same mechanism as the
; Volume Mixer - no injection, ban-safe). The focused client keeps audio.
MuteBackground=1

; Prime shared file-backed pages (exe/dll/pak) of each new client once via
; named file mappings - one warm pass serves all instances of that version.
WarmClientFiles=1
WarmMaxMB=256

; Windowed-farm safeguards. GDI/USER quota tweaks apply with ApplyTweaks
; (admin, reboot). DesktopHeapExpand edits csrss boot parameters
; (SharedSection second number -> 30720 KB) - keep 0 unless you actually
; hit "not enough quota" errors at ~50+ windowed clients!
DesktopHeapExpand=0

[Net]
; Junction-based cache sharing between client copies. Every path in
; CacheLinks (semicolon-separated) becomes a junction into
; SharedCacheRoot\<name>; only EMPTY dirs are converted automatically.
; Example:
; SharedCacheRoot=D:\RobloxSharedCache
; CacheLinks=%LOCALAPPDATA%\Roblox\HttpCache
SharedCacheRoot=
CacheLinks=

[Roblox]
; Written into ClientSettings\ClientAppSettings.json of every installed
; client version. Existing user flags are preserved.

; Remove the FPS cap (Roblox defaults to 60).
UncapFps=1
TargetFps=999

; Renderer=Auto|Vulkan|D3D11|D3D10|OpenGL. Auto keeps the client's choice.
Renderer=Auto

; Lighting=Auto|Voxel|ShadowMap|Future. Voxel renders fastest, Future
; looks best. Auto keeps the game's own setting.
Lighting=Auto

; TextureQuality=Auto|0|1|2|3 (0 = lowest / fastest).
TextureQuality=Auto

; Disable the client's telemetry reporting.
DisableTelemetry=1

; Extra client roots for portable / multi-manager installs, separated by
; semicolons. Any subfolder containing RobloxPlayerBeta.exe is picked up.
; Example:
; ExtraVersionsDirs=D:\RobloxMultiManager\clients
ExtraVersionsDirs=
