; TASX configuration — farm 25-30 clients, FPS cap 20, full potato
; All keys optional, defaults work without file.
; Booleans: 1/0 (true/false/on/off). Hot-reload: edits picked up in ~10s.
; Inline comments after values ("key=val ; comment") are supported.

[TASX]
; Trimmer: UNFOCUSED farm clients are WORKING, not idle (focused never trimmed).
; FarmKeepHot=1: periodic pass is soft-only; hard trim only after
; HardTrimAfterSec of continuous unfocus (or commit-critical >=90%).
TrimUnfocused=0 ; 0=never send clients to pagefile
TrimIntervalSec=10
AdaptiveTrim=1
TrimSkipBelowMB=250
FarmKeepHot=1
HardTrimAfterSec=1800
; Background memory priority 1=VeryLow..5=Normal (default 2=Low on farm)
BackgroundMemPriority=2

; Job Object policy
; JobAssignMode: auto=try assign + sticky fallback on foreign Job (default)
;              diagnose=same + InJob diagnostics (deprecated alias: force)
;              off=never assign, per-process fallback only
JobAssignMode=auto ; auto=try assign + sticky fallback, diagnose=+InJob log, off=per-process only
; Cap for background cgroup in percent (0=off). 20-30% keeps shell snappy.
BackgroundCpuCapPercent=0
JobCpuCapPercent=0 ; legacy alias, ignored when BackgroundCpuCapPercent is set
; Per-process memory cap: 0=off, 8192 for farm. Budget rule: N x avgWS < RAM x 0.75
; e.g. 30 clients x 400 MB = 12 GB — fits 31 GB RAM with headroom.
JobMemoryCapMB=8192
KillOnAgentExit=1
CommitBlockThreshold=85
MuteBackground=1
; Background affinity is always all P+E cores; legacy pin keys ignored.
PinBackgroundToECores=0
DynamicAffinity=0

; Focus anti-flap: min time in state before TASX reacts (coalesces rewrites)
FocusDwellMs=1800
FocusHysteresisMs=500 ; legacy alias, ignored when FocusDwellMs is set

; Free-space warning threshold on pagefile volume (GB)
PagefileWarnFreeGB=8

; Low-memory reactor + system cleaner (split halves)
LowMemReactor=1
LowMemCooldownSec=30
SystemCleaner=1
SystemCleanStandby=1
SystemCleanEmptyWS=0 ; 1=also empty ALL working sets (NOT for keep-hot farms)
SystemCleanMinIntervalSec=60
PurgeStandbyOnLaunch=1 ; debounced to 1 per 60s for pack spawns

SelfCpuWatchdogPercent=5
; FarmBoost hotkey: toggles ALL clients between E-cores/IDLE/EcoQoS and
; full power (HIGH/all cores, EcoQoS off, trimming suspended). System-wide,
; works from any window. Format: Modifiers+Key, e.g. Ctrl+Alt+F9.
; BoostHotkey=off disables. Newborn clients join the hot farm automatically.
BoostHotkey=Ctrl+Alt+B
PageInIntervalSec=300 ; 0=manual only, >0=auto page-in every N sec
; FarmBoostDefault=1: start with the whole farm hot (macro farms, no focus play).
FarmBoostDefault=0
KillCrashHandler=1
; 0.5ms timer auto-disabled on farm presets without focus (pure farm)
TimerResolution=1
PowerPlan=1
ApplyTweaks=1
DisableCpuBoost=0
WarmClientFiles=1
WarmMaxMB=256
DesktopHeapExpand=0

; Injector/FFlags: who owns graphics
InjectorOwnsGraphics=0 ; 0=farm owns graphics, 1=injector owns
ForceGraphicsFlags=0 ; 1=write graphics flags even if InjectorOwnsGraphics=1

[Roblox]
; Legacy section — compat only, overridden by [FastFlags] Preset.
; NOTE (09.2025+): Roblox allowlists 18 local flags; most legacy mappings are
; dead client-side. Renderer=D3D10 falls back to D3D11 (FL10 not allowlisted);
; Lighting=Voxel maps to PauseVoxelizer+SkyGray (voxel forcing dead).
; Only D3D11/Vulkan/OpenGL + TextureQuality + TargetFps-placeholder apply.
UncapFps=0
TargetFps=20
Renderer=D3D10 ; Auto|Vulkan|D3D11|D3D10->D3D11|OpenGL
Lighting=Voxel ; Auto|Voxel->PauseVoxelizer|ShadowMap|Future (last two ignored)
TextureQuality=0 ; Auto|0|1|2|3 (0=lowest, full potato, alive)
DisableTelemetry=1 ; JSON flags blocked by allowlist; ETW suppression still works
ExtraVersionsDirs=

[FastFlags]
; Preset: farm20 | farm30 | weak | balanced | off (off=manual keys + [Roblox] only)
; farm15 = deprecated alias of farm20.
; Alive potato set (Roblox allowlist, 18 keys): Tex0, FRM0, grass 0, CSG-low,
; PauseVoxelizer, SkyGray, MSAA1, NoDPIScale, D3D11. FPS-intent placeholder
; DFIntTaskSchedulerTargetFps is written (zero-cost if ignored).
Preset=farm20
; Prune pre-allowlist dead keys from JSON (default ON for farm presets).
; Runs only when TASX owns graphics (never fights the injector).
FFlagsPruneDead=1
; Manual key=value on top of preset (allowlisted keys or FPS placeholder only):
; FIntFRMMaxGrassDistance=0
; DFIntTaskSchedulerTargetFps=20
; Graphics skipped when InjectorOwnsGraphics=1 without ForceGraphicsFlags=1.

[ETW]
DisableTelemetry=1

[Log]
; info for setup, warn for 24/7 farm (1 MB rotation, 1 backup)
LogLevel=info
LogFile=

[Net]
SharedCacheRoot=
CacheLinks=
